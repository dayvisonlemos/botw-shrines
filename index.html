<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santuários BotW</title>
<style>
  :root { --bg:#0f1318; --card:#1a2028; --text:#fff; --muted:#8a8f98; --accent:#4fd1c5; --line:#4a5565; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { margin:0; font-size:24px; }
  .counter { color:var(--accent); font-weight:600; margin-top:2px; }
  .bar { height:6px; background:#222a33; border-radius:3px; margin:8px 0 16px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  .tabs { display:flex; background:var(--card); border-radius:10px; padding:3px; margin-bottom:10px; }
  .tabs button { flex:1; padding:9px; border:0; border-radius:8px; background:none; color:#aab1bb; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:var(--bg); }
  .filters { display:flex; gap:8px; margin-bottom:12px; }
  .filters input, .filters select { background:var(--card); color:var(--text); border:0; border-radius:10px; padding:10px 12px; font:inherit; }
  .filters input { flex:1; min-width:0; }
  ul { list-style:none; margin:0; padding:0; }
  li label { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:10px; padding:12px; margin-bottom:8px; cursor:pointer; }
  input[type=checkbox] { appearance:none; width:26px; height:26px; flex:none; border:2px solid var(--line); border-radius:6px; margin:0; display:grid; place-items:center; cursor:pointer; }
  input[type=checkbox]:checked { background:var(--accent); border-color:var(--accent); }
  input[type=checkbox]:checked::after { content:"✓"; color:var(--bg); font-weight:800; }
  .name { font-weight:600; } .num { color:#6b7585; font-weight:400; }
  .sub { color:var(--muted); font-size:13px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
</style>
</head>
<body>
<main>
  <h1>Santuários BotW</h1>
  <div class="counter" id="counter"></div>
  <div class="bar"><i id="fill"></i></div>

  <div class="tabs">
    <button id="tab-pending" class="active"></button>
    <button id="tab-done"></button>
  </div>

  <div class="filters">
    <input id="q" type="search" placeholder="Buscar por nome, desafio ou região" autocomplete="off">
    <select id="region"></select>
  </div>

  <ul id="list"></ul>
</main>

name":"Kema Kosassa","trial":"A Major Test of Strength","region":"Gerudo Highlands"},{"id":101,"name":"Sasa Kai","trial":"A Modest Test of Strength","region":"Gerudo Highlands"},{"id":102,"name":"Joloo Nah","trial":"Joloo Nah Apparatus","region":"Gerudo Highlands"},{"id":103,"name":"Sho Dantu","trial":"Two Bombs","region":"Gerudo Highlands"},{"id":104,"name":"Shora Hah","trial":"Blue Flame","region":"Eldin"},{"id":105,"name":"Daqa Koh","trial":"Stalled Flight","region":"Eldin"},{"id":106,"name":"Qua Raym","trial":"A Balanced Approach","region":"Eldin"},{"id":107,"name":"Tah Muhl","trial":"Passing the Flame","region":"Eldin"},{"id":108,"name":"Mo'a Keet","trial":"Metal Makes a Path","region":"Eldin"},{"id":109,"name":"Sah Dahaj","trial":"Power of Fire","region":"Eldin"},{"id":110,"name":"Gorae Torr","trial":"Gorae Torr's Blessing","region":"Eldin"},{"id":111,"name":"Kayra Mah","trial":"Greedy Hill","region":"Eldin"},{"id":112,"name":"Shae Mo'sah","trial":"Swinging Flames","region":"Eldin"},{"id":113,"name":"Zuna Kai","trial":"Zuna Kai's Blessing","region":"Akkala"},{"id":114,"name":"Ze Kasho","trial":"Ze Kasho Apparatus","region":"Akkala"},{"id":115,"name":"Ke'nai Shakah","trial":"A Modest Test of Strength","region":"Akkala"},{"id":116,"name":"Ritaag Zumo","trial":"Ritaag Zumo's Blessing","region":"Akkala"},{"id":117,"name":"Tutsuwa Nima","trial":"A Major Test of Strength","region":"Akkala"},{"id":118,"name":"Tu Ka'loh","trial":"Tu Ka'loh's Blessing","region":"Akkala"},{"id":119,"name":"Dah Hesho","trial":"A Minor Test of Strength","region":"Akkala"},{"id":120,"name":"Katosa Aug","trial":"Katosa Aug Apparatus","region":"Akkala"}];
const REGIONS = ["Great Plateau","Dueling Peaks","Hateno","Lanayru","Great Hyrule Forest","Central Hyrule","Lake","Faron","Ridgeland","Tabantha","Hebra","Gerudo Wasteland","Gerudo Highlands","Eldin","Akkala"];
const KEY = 'botw-shrines-done-v1';

let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
let tab = 'pending';

const $ = (id) => document.getElementById(id);
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('region').innerHTML = ['Todas', ...REGIONS].map((r) => `<option>${esc(r)}</option>`).join('');

function render() {
  const total = SHRINES.length;
  const n = Object.keys(done).length;
  $('counter').textContent = `${n} / ${total} concluídos`;
  $('fill').style.width = `${(n / total) * 100}%`;
  $('tab-pending').textContent = `Pendentes (${total - n})`;
  $('tab-done').textContent = `Concluídos (${n})`;
  $('tab-pending').classList.toggle('active', tab === 'pending');
  $('tab-done').classList.toggle('active', tab === 'done');

  const q = norm($('q').value.trim());
  const region = $('region').value;
  const items = SHRINES.filter((s) =>
    !!done[s.id] === (tab === 'done') &&
    (region === 'Todas' || s.region === region) &&
    (!q || norm(`${s.name} ${s.trial} ${s.region}`).includes(q)));

  $('list').innerHTML = items.length
    ? items.map((s) => `<li><label>
        <input type="checkbox" data-id="${s.id}" ${done[s.id] ? 'checked' : ''}>
        <span><span class="name"><span class="num">#${s.id}</span> ${esc(s.name)}</span><br>
        <span class="sub">${esc(s.trial)} · ${esc(s.region)}</span></span>
      </label></li>`).join('')
    : '<p class="empty">Nenhum santuário encontrado.</p>';
}

$('list').addEventListener('change', (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.checked) done[id] = true; else delete done[id];
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch {}
  render();
});
$('tab-pending').onclick = () => { tab = 'pending'; render(); };
$('tab-done').onclick = () => { tab = 'done'; render(); };
$('q').oninput = render;
$('region').onchange = render;
render();
</script>
</body>
</html>
